name: Refresh profile
on:
  schedule:
    - cron: '23 6,14,22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile.yml']
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Reruns retain the original event SHA, which may predate our last publish.
          # Generate from the current publication branch, including on queued runs.
          ref: main
          fetch-depth: 0
      - name: Test profile generators and failure handling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh public projects, upstream PRs and blog RSS
        id: feeds
        continue-on-error: true
        run: python3 scripts/update-profile.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Contribution totals (dark)
        id: stats_dark
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats
          path: assets/stats-dark.svg
          fail_on_error: 'true'
          options: username=Dante-dan&card_width=340&hide_rank=true&show_icons=true&hide_border=true&bg_color=0d1117&text_color=c9d1d9&title_color=58a6ff&icon_color=58a6ff&custom_title=Public%20contributions&disable_animations=true
      - name: Commit time distribution (dark)
        id: time_dark
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@e722eded97059b31d7e8ad3ae0267b74ff24172d
        with:
          USERNAME: Dante-dan
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: github_dark
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Keep only the time card (dark)
        id: copy_time_dark
        if: steps.time_dark.outcome == 'success'
        run: cp profile-summary-card-output/github_dark/4-productive-time.svg assets/time-dark.svg
      - name: Contribution totals (light)
        id: stats_light
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e
        with:
          card: stats
          path: assets/stats-light.svg
          fail_on_error: 'true'
          options: username=Dante-dan&card_width=340&hide_rank=true&show_icons=true&hide_border=true&bg_color=ffffff&text_color=24292f&title_color=0969da&icon_color=0969da&custom_title=Public%20contributions&disable_animations=true
      - name: Commit time distribution (light)
        id: time_light
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@e722eded97059b31d7e8ad3ae0267b74ff24172d
        with:
          USERNAME: Dante-dan
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: github
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Keep only the time card (light)
        id: copy_time_light
        if: steps.time_light.outcome == 'success'
        run: cp profile-summary-card-output/github/4-productive-time.svg assets/time-light.svg
      - name: Refresh recent public reactions
        id: reactions
        continue-on-error: true
        run: python3 scripts/telemetry.py reactions
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Harmonize card typography and colors
        run: python3 scripts/style-cards.py
      - name: Version card URLs and record successful fetches
        run: python3 scripts/telemetry.py finalize
        env:
          STATS_OK: ${{ steps.stats_dark.outcome == 'success' && steps.stats_light.outcome == 'success' }}
          TIME_OK: ${{ steps.copy_time_dark.outcome == 'success' && steps.copy_time_light.outcome == 'success' }}
          REACTIONS_OK: ${{ steps.reactions.outcome == 'success' }}
      - name: Publish successful updates
        if: always()
        run: bash scripts/commit-profile.sh
      - name: Report incomplete refresh
        if: steps.reactions.outcome == 'failure' || steps.feeds.outcome == 'failure' || steps.stats_dark.outcome == 'failure' || steps.stats_light.outcome == 'failure' || steps.time_dark.outcome == 'failure' || steps.time_light.outcome == 'failure'
        run: |
          echo 'Some sources failed. Their previous content was retained.'
          exit 1
