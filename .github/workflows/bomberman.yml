name: Generate Bomberman animation

on:
  schedule: # execute daily
    - cron: "43 22 * * *"

  workflow_dispatch:

  push:
    branches:
    - main
    paths:
    - .github/workflows/bomberman.yml

concurrency:
  group: contribution-animation
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Bomberman contribution graphs
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: bomberman
          github_token: ${{ github.token }}


      - name: Publish Bomberman SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@c05ee637ec73429400a359430db8e5629f3f2564
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
